version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: ankita_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 5432
      POSTGRES_DB: ankita_processors
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ankita_api
    command: sh -c "cd apps/api/build && node bin/server.js"
    ports:
      - "3333:3333"
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=5432
      - DB_DATABASE=ankita_processors
      - APP_KEY=3y1_14q8u7zV1F9O0t3l6G-5P2E4y_9T
      - HOST=0.0.0.0
    depends_on:
      - postgres

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ankita_web
    command: pnpm --filter=@ankita/web start
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3333/api/v1
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ankita_admin
    command: pnpm --filter=@ankita/admin start
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3333/api/v1
    depends_on:
      - api

volumes:
  pgdata:
